name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
          
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: 安装依赖
        run: pnpm install
        
      - name: TypeScript 类型检查
        run: pnpm type-check

      - name: 构建验证（警告即失败）
        run: |
          pnpm build 2>&1 | tee build.log
          if grep -qiE "warning|error" build.log; then
            echo "构建包含警告或错误"
            exit 1
          fi
        
      # - name: 构建验证
      #   run: pnpm build